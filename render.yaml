# Render Blueprint - one-click deploy of the T3 dashboard.
# https://render.com/docs/blueprint-spec
#
# region is pinned to frankfurt, NOT Render's "oregon" default: production
# logs from an earlier deploy of this exact app in "oregon" showed Binance
# returning HTTP 451 (Unavailable For Legal Reasons) on every request -
# Binance blocks API access (REST klines AND the public WebSocket) from
# US-region IPs at the network edge, regardless of symbol/auth. Frankfurt/
# Singapore are not subject to that specific block. See README "Deploying
# to Render" for the full story if you still see 451s after this.
services:
  - type: web
    name: t3-elliott-wave-engine
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn t3_engine.dashboard.server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.6
      - key: T3_TRADING_MODE
        value: PAPER
      - key: T3_ENTRY_CONFIDENCE_THRESHOLD
        value: "75.0"
      - key: T3_DATABASE_URL
        value: sqlite:////opt/render/project/src/t3_engine.db
      - key: T3_LOG_DIR
        value: /opt/render/project/src/logs
    # Render's free-tier disk is ephemeral (wiped on every deploy/restart).
    # For trade history that survives redeploys, attach a Render Postgres
    # instance and set T3_DATABASE_URL to its connection string instead -
    # see README "Deploying to Render".
