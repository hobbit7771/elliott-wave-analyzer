<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>T3 - Elliott Wave Trading Engine</title>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
  :root { color-scheme: dark; }
  body { margin:0; font-family: -apple-system, Segoe UI, Roboto, sans-serif; background:#0e1117; color:#d7dbe0; }
  header { padding: 10px 16px; border-bottom: 1px solid #232733; display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size: 15px; margin:0; font-weight:600; color:#f2f4f8; }
  header label { font-size: 12px; color:#9aa3b2; }
  header select, header input, header button {
    background:#1b2028; color:#e6e9ef; border:1px solid #2c3140; border-radius:6px; padding:4px 8px; font-size:12px;
  }
  header button { cursor:pointer; }
  #layout { display:flex; height: calc(100vh - 52px); }
  #chart { flex: 1 1 auto; }
  #panel { width: 340px; border-left:1px solid #232733; padding:12px; overflow-y:auto; font-size:12.5px; }
  #panel h2 { font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:#8891a3; margin:14px 0 6px; }
  #panel h2:first-child { margin-top:0; }
  .row { display:flex; justify-content:space-between; padding:2px 0; }
  .row .k { color:#9aa3b2; }
  .row .v { color:#e6e9ef; font-weight:500; }
  .pill { display:inline-block; padding:2px 8px; border-radius:999px; font-size:11px; font-weight:600; }
  .pill.up { background:#123a2c; color:#4ade80; }
  .pill.down { background:#3a1414; color:#f87171; }
  .signal { border:1px solid #232733; border-radius:8px; padding:8px; margin-bottom:8px; }
  .signal.accepted { border-color:#22543d; }
  .signal.rejected { border-color:#4a1f24; opacity:.75; }
  .note { background:#1b2028; border:1px solid #2c3140; border-radius:8px; padding:8px; font-size:11.5px; color:#9aa3b2; }
  table { width:100%; border-collapse: collapse; font-size:11.5px; }
  td, th { padding:3px 4px; border-bottom:1px solid #232733; text-align:right; }
  th:first-child, td:first-child { text-align:left; }
</style>
</head>
<body>
<header>
  <h1>T3 &mdash; Elliott Wave Engine</h1>
  <label>Source
    <select id="source"><option value="synthetic">Synthetic demo</option><option value="binance">Binance (live REST)</option></select>
  </label>
  <label>Symbol <input id="symbol" value="SYNTHETIC-DEMO" size="12" /></label>
  <label>Cycles <input id="cycles" type="number" value="2" min="1" max="10" size="3" /></label>
  <label>Threshold <input id="threshold" type="number" value="60" min="0" max="100" size="3" /></label>
  <button id="run">Run</button>
  <span id="status" style="color:#8891a3;font-size:12px;"></span>
</header>
<div id="layout">
  <div id="chart"></div>
  <div id="panel">
    <div class="note" id="note" style="display:none;"></div>
    <h2>Debug State</h2>
    <div id="debug"></div>
    <h2>Primary Scenario</h2>
    <div id="primary"></div>
    <h2>Signals</h2>
    <div id="signals"></div>
    <h2>Closed Trades &amp; Metrics</h2>
    <div id="metrics"></div>
  </div>
</div>

<script>
const chartEl = document.getElementById('chart');
const chart = LightweightCharts.createChart(chartEl, {
  layout: { background: { color: '#0e1117' }, textColor: '#c7cbd3' },
  grid: { vertLines: { color: '#1b1f29' }, horzLines: { color: '#1b1f29' } },
  timeScale: { timeVisible: true, secondsVisible: false },
  rightPriceScale: { borderColor: '#232733' },
});
function resize() { chart.resize(chartEl.clientWidth, chartEl.clientHeight); }
new ResizeObserver(resize).observe(chartEl);

const candleSeries = chart.addCandlestickSeries({
  upColor: '#26a69a', downColor: '#ef5350', borderVisible: false,
  wickUpColor: '#26a69a', wickDownColor: '#ef5350',
});

let overlayLines = [];
function clearOverlays() {
  overlayLines.forEach(s => chart.removeSeries(s));
  overlayLines = [];
}

function drawWaves(waves) {
  // Each confirmed wave leg drawn as a 2-point line anchored to its real
  // start/end candle price - never a schematic sketch (spec section 18).
  waves.forEach(w => {
    const series = chart.addLineSeries({ color: w.direction === 'UP' ? '#4ade80' : '#f87171', lineWidth: 2, lastValueVisible: false, priceLineVisible: false });
    series.setData([
      { time: w.start_time, value: w.start_price },
      { time: w.end_time, value: w.end_price },
    ]);
    overlayLines.push(series);
  });
}

function drawTradeLevels(signals) {
  const accepted = signals.filter(s => s.decision === 'SIGNAL_ACCEPTED').slice(-5);
  accepted.forEach(s => {
    [{ price: s.stop_loss, color: '#f87171', title: 'SL' },
     ...(s.take_profits || []).map((tp, i) => ({ price: tp.price, color: '#60a5fa', title: `TP${i + 1}` }))]
    .forEach(level => {
      const line = candleSeries.createPriceLine({ price: level.price, color: level.color, lineWidth: 1, lineStyle: 2, title: level.title });
      overlayLines.push({ removeSeries: () => candleSeries.removePriceLine(line) });
    });
  });
}

function markers(events, scenarios) {
  const m = [];
  events.forEach(e => {
    m.push({ time: e.time, position: e.direction === 'UP' ? 'belowBar' : 'aboveBar',
             color: e.kind === 'CHoCH' ? '#facc15' : '#60a5fa', shape: e.direction === 'UP' ? 'arrowUp' : 'arrowDown',
             text: e.kind });
  });
  scenarios.forEach(sc => sc.waves.forEach(w => {
    m.push({ time: w.end_time, position: 'inBar', color: '#9aa3b2', shape: 'circle', text: w.label });
  }));
  m.sort((a, b) => a.time - b.time);
  candleSeries.setMarkers(m);
}

function row(k, v) { return `<div class="row"><span class="k">${k}</span><span class="v">${v}</span></div>`; }

function renderDebugPanel(data) {
  const primary = data.scenarios[0];
  const debugEl = document.getElementById('debug');
  const wave = primary && primary.waves.length ? primary.waves[primary.waves.length - 1] : null;
  debugEl.innerHTML = [
    row('Symbol', data.symbol),
    row('Primary wave', wave ? wave.label : '—'),
    row('Status', wave ? wave.status : '—'),
    row('Confidence', primary ? primary.probability.toFixed(1) + '%' : '—'),
    row('Invalidation', primary && primary.invalidation ? primary.invalidation.toFixed(4) : '—'),
    row('Next expected', primary && primary.next_expected_label ? primary.next_expected_label : '—'),
    row('Final equity', data.final_equity.toFixed(2)),
  ].join('');

  const primaryEl = document.getElementById('primary');
  if (!data.scenarios.length) {
    primaryEl.innerHTML = '<div class="note">No valid Elliott scenario currently active. Structure is ambiguous — NO TRADE (section 22).</div>';
  } else {
    primaryEl.innerHTML = data.scenarios.map((sc, i) => `
      <div class="signal ${i === 0 ? 'accepted' : ''}">
        <div class="row"><span class="k">Scenario ${i + 1}</span><span class="v">${sc.probability.toFixed(1)}%</span></div>
        <div class="row"><span class="k">Status</span><span class="v">${sc.status}</span></div>
        <div class="row"><span class="k">Waves</span><span class="v">${sc.waves.map(w => w.label).join(' → ')}</span></div>
      </div>`).join('');
  }

  const sigEl = document.getElementById('signals');
  const recent = data.signals.slice(-15).reverse();
  sigEl.innerHTML = recent.length ? recent.map(s => `
    <div class="signal ${s.decision === 'SIGNAL_ACCEPTED' ? 'accepted' : 'rejected'}">
      <div class="row"><span class="k">${s.wave_label} ${s.side}</span><span class="pill ${s.decision === 'SIGNAL_ACCEPTED' ? 'up' : 'down'}">${s.decision.replace('SIGNAL_', '')}</span></div>
      <div class="row"><span class="k">Confidence</span><span class="v">${s.confidence.toFixed(1)}</span></div>
      <div class="row"><span class="k">Reason</span><span class="v" style="text-align:left;max-width:200px;">${s.reason || s.rejection_reason || ''}</span></div>
    </div>`).join('') : '<div class="note">No signals evaluated.</div>';

  const metricsEl = document.getElementById('metrics');
  const m = data.metrics.overall;
  let html = `<table><tr><th>Metric</th><th>Overall</th></tr>
    <tr><td>Trades</td><td>${m.trades}</td></tr>
    <tr><td>Winrate</td><td>${(m.winrate * 100).toFixed(1)}%</td></tr>
    <tr><td>Profit Factor</td><td>${m.profit_factor ? m.profit_factor.toFixed(2) : '—'}</td></tr>
    <tr><td>Expectancy</td><td>${m.expectancy.toFixed(2)}</td></tr>
    <tr><td>Avg R</td><td>${m.average_r.toFixed(2)}</td></tr>
    <tr><td>Median R</td><td>${m.median_r.toFixed(2)}</td></tr>
    <tr><td>Max DD</td><td>${(m.max_drawdown * 100).toFixed(1)}%</td></tr>
    </table><div style="margin-top:8px;font-weight:600;">By wave type</div><table><tr><th>Wave</th><th>Trades</th><th>Winrate</th><th>Avg R</th></tr>`;
  Object.entries(data.metrics.by_wave).forEach(([k, v]) => {
    html += `<tr><td>${k}</td><td>${v.trades}</td><td>${(v.winrate * 100).toFixed(0)}%</td><td>${v.average_r.toFixed(2)}</td></tr>`;
  });
  html += '</table>';
  metricsEl.innerHTML = html;

  const noteEl = document.getElementById('note');
  if (data.note) { noteEl.style.display = 'block'; noteEl.textContent = data.note; }
  else { noteEl.style.display = 'none'; }
}

async function run() {
  const source = document.getElementById('source').value;
  const symbol = document.getElementById('symbol').value;
  const cycles = document.getElementById('cycles').value;
  const threshold = document.getElementById('threshold').value;
  document.getElementById('status').textContent = 'running…';
  const resp = await fetch(`/api/run?source=${source}&symbol=${encodeURIComponent(symbol)}&cycles=${cycles}&threshold=${threshold}`);
  const data = await resp.json();
  document.getElementById('status').textContent = `${data.candles.length} candles`;

  candleSeries.setData(data.candles);
  clearOverlays();
  data.scenarios.forEach(sc => drawWaves(sc.waves));
  drawTradeLevels(data.signals);
  markers(data.structure_events, data.scenarios);
  chart.timeScale().fitContent();
  renderDebugPanel(data);
}

document.getElementById('run').addEventListener('click', run);
window.addEventListener('load', run);
</script>
</body>
</html>
